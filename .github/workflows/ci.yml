name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: extractions/setup-just@v3
        with:
          just-version: "1.40.0"

      - run: uv sync --locked
      - run: just check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        postgres: [17]
        include:
          - python-version: "3.14"
            postgres: 11

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fear_of_sql_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U user -d fear_of_sql_test"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: extractions/setup-just@v3
        with:
          just-version: "1.40.0"

      - run: uv sync --locked
      - run: just cov-run

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}-pg${{ matrix.postgres }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - run: uvx --from 'coverage[toml]' coverage combine
      - run: uvx --from 'coverage[toml]' coverage report
